<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informativo - Proyectos de Investigación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            background-color: #f0f4ff;
            color: #1c2a3d;
            padding: 10px;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .titulo-informativo {
            background-color: #0b3558;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .botones-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 95%;
            margin: 0 auto;
            padding: 10px;
            flex: 1;
        }
        .boton-informativo {
            background-color: #62a8ea;
            color: white;
            font-weight: bold;
            border: none;
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            height: 120px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .boton-informativo:hover {
            background-color: #5295d6;
            transform: translateY(-3px);
            box-shadow: 0 7px 10px rgba(0, 0, 0, 0.2);
        }
        .boton-informativo:active {
            transform: translateY(1px);
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.2);
        }
        .boton-informativo::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%, -50%);
            transform-origin: 50% 50%;
        }
        .boton-informativo:focus:not(:active)::after {
            animation: ripple 1s ease-out;
        }
        @keyframes ripple {
            0% { transform: scale(0, 0); opacity: 0.5; }
            100% { transform: scale(20, 20); opacity: 0; }
        }
        .volver-btn {
            background-color: #0b3558;
            color: white;
            font-weight: bold;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin: 20px auto;
            display: block;
            transition: all 0.3s ease;
            width: fit-content;
        }
        .volver-btn:hover {
            background-color: #1c7ed6;
            transform: scale(1.05);
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            overflow: auto;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fefefe;
            position: relative;
            width: 95%;
            max-width: 900px;
            height: 90%;
            margin: auto;
            padding: 0;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .modal-close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #aaa;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            z-index: 1001;
        }
        .modal-close-btn:hover {
            color: #000;
        }
        #pdfViewer {
            width: 100%;
            height: 100%;
            border: none;
        }
        @media (max-width: 768px) {
            .botones-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="titulo-informativo">
        CONOCE SOBRE LOS PROYECTOS
    </div>
    <div class="botones-container">
        <button class="boton-informativo" onclick="verGuiaProyecto()">GUÍA PARA LA ELABORACIÓN DE PROYECTO DE INVESTIGACIÓN</button>
        <button class="boton-informativo" onclick="verPrioridadesNacionales()">PRIORIDADES NACIONALES DE INVESTIGACIÓN EN SALUD</button>
        <button class="boton-informativo" onclick="verBoton1()">NORMA TÉCNICA DE BIOSEGURIDAD</button>
        <button class="boton-informativo" onclick="verBoton2()"> NORMAS DEL SISTEMA DE REFERENCIA Y CONTRAREFERENCIA</button>
        <button class="boton-informativo" onclick="verBoton3()">NORMA TÉCNICA DE SALUD PARA TRANSPORTE ASISTIDO DE PACIENTES POR VIA TERRESTRE</button>
        <button class="boton-informativo" onclick="verBoton4()">NORMAS PARA LA NOTIFICACION DE ENFERMEDADES SUJETAS A VIGILANCIA</button>
        <button class="boton-informativo" onclick="verBoton5()">NORMAS PARA USO, MANEJO, CONSERVACION Y DEPURACION DE HISTORIAS CLINICAS</button>
        <button class="boton-informativo" onclick="verBoton6()">NORMAS DE LIMPIEZA, DESINFECCION Y ESTERILIZACION</button>
        <button class="boton-informativo" onclick="verBoton7()">NORMA TÉCNICA DE SALUD IAAS</button>
        <button class="boton-informativo" onclick="verBoton8()">MANUAL DE PROCEDIMIENTOS DE OPERACION NORMALIZADA PARA MICROBIOLGIA QUIMICA INMUNOLOGIA</button>
        <button class="boton-informativo" onclick="verBoton9()">SALUD Y SEGURIDAD EN EL TRABAJO</button>
        <button class="boton-informativo" onclick="verBoton10()">MANUAL DE SALUD Y SEGURIDAD EN EL TRABAJO</button>
    </div>
    <button class="volver-btn" onclick="window.location.href='index.html'">Volver</button>
    <div id="visor" class="modal">
        <div class="modal-content">
            <button onclick="ocultarPDF()" class="modal-close-btn">&times;</button>
            <iframe id="pdfViewer" src="" frameborder="0"></iframe>
        </div>
    </div>
    <script>
        function verGuiaProyecto() { abrirPDF('PDF/guia_elaboracion_proyecto.pdf'); }
        function verPrioridadesNacionales() { abrirPDF('PDF/prioridades_nacionales_investigacion.pdf'); }
        function verBoton1() { abrirPDF('PDF/boton1.pdf'); }
        function verBoton2() { abrirPDF('PDF/boton2.pdf'); }
        function verBoton3() { abrirPDF('PDF/boton3.pdf'); }
        function verBoton4() { abrirPDF('PDF/boton4.pdf'); }
        function verBoton5() { abrirPDF('PDF/boton5.pdf'); }
        function verBoton6() { abrirPDF('PDF/boton6.pdf'); }
        function verBoton7() { abrirPDF('PDF/boton7.pdf'); }
        function verBoton8() { abrirPDF('PDF/boton8.pdf'); }
        function verBoton9() { abrirPDF('PDF/boton9.pdf'); }
        function verBoton9() { abrirPDF('PDF/boton10.pdf'); }

        function abrirPDF(ruta) {
            const visor = document.getElementById("visor");
            const pdfViewer = document.getElementById("pdfViewer");
            pdfViewer.src = ruta;
            visor.style.display = "flex";
        }
        function ocultarPDF() {
            const visor = document.getElementById("visor");
            const pdfViewer = document.getElementById("pdfViewer");
            visor.style.display = "none";
            pdfViewer.src = "";
        }
    </script>
</body>
</html>
